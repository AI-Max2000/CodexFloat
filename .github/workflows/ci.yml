name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Unit and integration tests
        run: swift test
      - name: Address Sanitizer
        run: swift test --sanitize=address
      - name: Thread Sanitizer
        run: swift test --sanitize=thread
      - name: Release build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Preserve native screenshot failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-screenshot-failures-${{ github.sha }}
          path: artifacts/native-failures/
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Universal 2 app
        env:
          CODEX_FLOAT_UNIVERSAL: "1"
          CODEX_FLOAT_VERSION: "0.1.0"
          CODEX_FLOAT_BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build-app.sh
      - name: Verify app bundle
        run: |
          plutil -lint dist/CodexFloat.app/Contents/Info.plist
          test -f dist/CodexFloat.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict dist/CodexFloat.app
          architectures="$(lipo -archs dist/CodexFloat.app/Contents/MacOS/CodexFloat)"
          [[ " ${architectures} " == *" arm64 "* ]]
          [[ " ${architectures} " == *" x86_64 "* ]]
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexFloat-unsigned-${{ github.sha }}
          path: dist/CodexFloat.app
          if-no-files-found: error
          retention-days: 7
