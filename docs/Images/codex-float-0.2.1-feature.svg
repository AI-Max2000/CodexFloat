    <text x="205" y="921" font-size="25" font-weight="620">共享锚点</text>
    <line x1="388" y1="878" x2="388" y2="938" stroke="#DDDCD7"/>

    <g transform="translate(458 886)" fill="none" stroke="#555B5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="38" height="30" rx="7"/>
      <path d="M10 14h20M10 23h14"/>
    </g>
    <text x="518" y="921" font-size="25" font-weight="620">目标窗口稳定</text>
    <line x1="731" y1="878" x2="731" y2="938" stroke="#DDDCD7"/>

    <g transform="translate(804 886)" fill="none" stroke="#555B5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 20a18 18 0 1 1 6 13"/>
      <path d="M2 8v12h12"/>
    </g>
    <text x="860" y="921" font-size="25" font-weight="620">系统通知提醒</text>
    <line x1="1084" y1="878" x2="1084" y2="938" stroke="#DDDCD7"/>

    <g transform="translate(1152 885)" fill="none" stroke="#555B5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 33l32-26M12 7h24v24"/>
    </g>
    <text x="1207" y="921" font-size="25" font-weight="620">只读打开用量页</text>

    <text x="68" y="988" font-size="18" fill="#555B5E">功能示意图 · 数据为示例 · 不会自动消耗 Reset</text>
    <text x="1468" y="988" text-anchor="end" font-size="18" fill="#555B5E">macOS 14+ · Apple Silicon / Intel · 未公证预览版</text>
  </g>
